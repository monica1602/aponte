name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ponte_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Checagem de tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Testes no SQLite
        run: npm test
      - name: Testes no PostgreSQL
        run: node --import ./tests/setup.mjs --test --test-concurrency=1 tests/*.test.mjs
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ponte_ci
      - name: Build
        run: npm run build
      - name: Navegador dos testes E2E
        run: npx playwright install --with-deps chromium
      - name: Testes E2E no SQLite
        run: npm run test:e2e
      - name: Testes E2E no PostgreSQL
        run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ponte_e2e
      - name: Prints e videos dos testes E2E que falharam
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-falhas
          path: |
            test-results/
            playwright-report/
          retention-days: 14
